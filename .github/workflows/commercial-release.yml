name: Max Hub - build comercial
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versao nova do Hub (ex. 0.4.3)
        required: true
      android_code:
        description: Codigo Android crescente (ex. 8)
        required: true
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilar instalador, APK e pacote de deploy
        env:
          MAXHUB_BUILD_PASSWORD: ${{ secrets.MAXHUB_BUILD_PASSWORD }}
          RELEASE_VERSION: ${{ inputs.version }}
          ANDROID_CODE: ${{ inputs.android_code }}
        run: |
          if (!$env:MAXHUB_BUILD_PASSWORD) { throw 'Cadastre MAXHUB_BUILD_PASSWORD nos Actions secrets.' }
          ./build-support/build.ps1 -Version $env:RELEASE_VERSION -AndroidVersionCode ([int]$env:ANDROID_CODE)
      - name: Disponibilizar pacote para o Pedro
        uses: actions/upload-artifact@v4
        with:
          name: MaxHub-${{ inputs.version }}-deploy
          path: build/portable-release/*/MaxHub-*-deploy.zip
          if-no-files-found: error
          retention-days: 14
