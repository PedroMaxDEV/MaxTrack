name: Windows portable build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Build
        shell: cmd
        run: scripts\build.bat
      - name: Zip portable application
        shell: pwsh
        run: Compress-Archive -Path dist/MaxTrack/* -DestinationPath MaxTrack-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MaxTrack-Windows-x64
          path: MaxTrack-Windows-x64.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME MaxTrack-Windows-x64.zip --generate-notes
